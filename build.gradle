plugins {
	id 'java'
	id 'fabric-loom' version '1.17.19'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	mavenCentral()
	maven { url "https://maven.meteordev.org/releases" }
	maven { url "https://maven.meteordev.org/snapshots" }
	maven { url "https://maven.seedfinding.com/" }
	maven { url "https://maven-snapshots.seedfinding.com/" }
	maven { url 'https://jitpack.io' }
	maven { url 'https://maven.duti.dev/releases' }
}

loom {
	accessWidenerPath = file("src/main/resources/meteor-rejects.classtweaker")
}

configurations {
	// configuration that holds jars to include in the jar
	extraLibs
}

dependencies {
	// Native cubiomes is the only remaining local dependency. Everything else that is available
	// from Maven is resolved remotely to keep Codespaces builds free from local-file artifacts.
	implementation files('libs/cubiomes.dll')
	// To change the versions see the gradle.properties file
	// Minecraft 26.x ships de-obfuscated, so no mappings are declared.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// With obfuscation disabled Loom does not register the mod* configurations,
	// so mod dependencies are declared like ordinary ones.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// 本地 JAR（放在 extraLibs 中打包）
	extraLibs files('libs/meteor-client-26.1.2-41.jar')
	extraLibs files('libs/baritone-meteor-26.1.jar')
	extraLibs files('libs/cubiomes.dll')
	extraLibs files('libs/mc_math.jar')
	extraLibs files('libs/mc_seed.jar')
	extraLibs files('libs/mc_core.jar')
	extraLibs files('libs/mc_noise.jar')
	extraLibs files('libs/mc_biome.jar')
	extraLibs files('libs/mc_terrain.jar')
	extraLibs files('libs/mc_feature.jar')
	extraLibs files('libs/seedcrackerX-2.16.0.jar')

	// Fabric API（从 Maven Central 获取，不包含 Cubiomes）
	compileOnly "net.fabricmc.fabric-api:fabric-resource-loader-v1:${project.fabric_resource_loader_version}"

	// 让 implementation 继承 extraLibs
	configurations.implementation.extendsFrom(configurations.extraLibs)
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"mc_version": project.minecraft_version,
				"gh_hash": (System.getenv("GITHUB_SHA") ?: "")
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}" }
	}
	from {
		configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
	}
}
tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// The Minecraft launcher currently installs Java 8 for users, so your mod probably wants to target Java 8 too
	// JDK 9 introduced a new way of specifying this that will make sure no newer classes or methods are used.
	// We'll use that if it's available, but otherwise we'll use the older option.
	def targetVersion = 21
	if (JavaVersion.current().isJava9Compatible()) {
		it.options.release = targetVersion
	}
}
